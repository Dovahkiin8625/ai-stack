[package]
name = "ai-stack"
version = "0.2.0"
description = "AI Stack — Windows AI 学习工作台"
authors = ["AI Stack"]
edition = "2021"
rust-version = "1.78"

[lib]
name = "ai_stack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-store = "2.1"
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-sql = { version = "2.0", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
once_cell = "1"
anyhow = "1"
thiserror = "1"

# Phase 5: LLM 翻译
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

# Phase 2 新增
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
comrak = { version = "0.22", default-features = false, features = ["shortcodes"] }
# PDF 渲染由前端 pdf.js 承担；后端只用 pdf-extract 数页（纯 Rust，无 native 依赖）
pdf-extract = "0.7"
docx-rs = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.36", features = ["serialize"] }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

# window-state 是桌面独占插件（不支持 Android/iOS）。
# 放在 target 段里，交叉编译到 Android 时 Cargo 根本不会解析它。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2.0"
